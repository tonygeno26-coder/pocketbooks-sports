<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MMA card visual fixture</title>
<link rel="preconnect" href="https://a.espncdn.com"/>
<style>
:root{--bg:#0e0e12;--card:#15151b;--text:#f2f2f2;--muted:#8a8a96;--line:#2a2a33}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2030,transparent),linear-gradient(180deg,#121218,#070709);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;padding:20px}
h1{font-size:0.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.market-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;max-width:720px}
.mc-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:0.75rem;font-weight:700}
.mc-cols{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:6px;margin-bottom:8px;color:#666;font-size:0.65rem;text-transform:uppercase;font-weight:800}
.mc-team-row{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:6px;align-items:center;padding:8px 0}
.mc-team{display:flex;align-items:center;gap:10px;min-width:0}
.mc-city{font-size:0.6rem;color:#777;text-transform:uppercase}
.mc-name{font-size:0.95rem;font-weight:900}
.mc-jersey{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:transparent}
.mc-jersey.mc-jersey-headshot img{width:52px;height:52px;object-fit:cover;border-radius:10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));display:block}
.odds{background:#1c1c24;border:1px solid #2d2d38;border-radius:10px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.odds .line{font-size:0.7rem;color:#9aa}
.odds .price{font-size:0.85rem}
.mc-divider{height:1px;background:#222;margin:2px 0}
.mc-footer{display:flex;justify-content:space-between;margin-top:8px;color:#777;font-size:0.72rem}
.slip{max-width:360px;background:#fff;color:#111;border-radius:14px;padding:10px 0;margin-top:18px}
.dkslip-leg{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f0f0}
.dkslip-leg-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.dkslip-leg-logo img{width:36px;height:36px;object-fit:cover;border-radius:10px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.dkslip-ou{font-size:1.7rem;font-weight:900;font-family:Impact,'Arial Black',sans-serif;line-height:1}
.dkslip-ou-o{color:#00e676}
.dkslip-ou-u{color:#ff3b30}
.pick{font-weight:900}
.mkt{font-size:0.65rem;color:#06c;font-weight:800;text-transform:uppercase}
.odds-s{margin-left:auto;font-weight:900}
.viewports{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.vp{padding:6px 10px;border:1px solid #333;border-radius:999px;font-size:0.72rem;color:#aaa}
</style>
<script src="player-photos.js"></script>
</head>
<body>
<h1>MMA visual fixture — fighter cards + slip</h1>
<div class="viewports">
  <span class="vp">390</span><span class="vp">768</span><span class="vp">1280</span><span class="vp">1440</span>
</div>
<div id="cards"></div>
<div class="slip" id="slip"></div>
<script>
var fights = [
  { league:'Noche UFC', away:'Joseph Morales', home:'Brandon Moreno', awML:115, hwML:-135, time:'Sat 5:00 PM' },
  { league:'UFC Paris', away:'Benot Benali-Slimane', home:'Fares Ziam', awML:210, hwML:-255, time:'Sat 12:00 PM' },
  { league:'UFC 331', away:'Alexandre Pantoja', home:'Joshua Van', awML:-150, hwML:130, time:'Sat 10:00 PM' }
];
function avatar(name){
  if (typeof getPlayerPhotoImg === 'function') {
    return '<div class="mc-jersey mc-jersey-headshot">' + getPlayerPhotoImg(name, 'mma', 52, {borderRadius:'10px'}) + '</div>';
  }
  return '<div class="mc-jersey">' + name.slice(0,2).toUpperCase() + '</div>';
}
function split(n){
  var p = String(n).split(' ');
  return { c: p.slice(0,-1).join(' '), n: p.slice(-1)[0] };
}
var cards = document.getElementById('cards');
fights.forEach(function(f){
  var a = split(f.away), h = split(f.home);
  cards.innerHTML += '<div class="market-card">' +
    '<div class="mc-header"><span>🥊</span><span>'+f.league+'</span></div>' +
    '<div class="mc-cols"><div></div><div>Spread</div><div>Total</div><div>To Win</div></div>' +
    '<div class="mc-team-row"><div class="mc-team">'+avatar(f.away)+'<div><div class="mc-city">'+a.c+'</div><div class="mc-name">'+a.n+'</div></div></div>' +
    '<div class="odds"><span class="line">—</span></div><div class="odds"><span class="line">—</span></div><div class="odds"><span class="price">'+(f.awML>0?'+':'')+f.awML+'</span></div></div>' +
    '<div class="mc-divider"></div>' +
    '<div class="mc-team-row"><div class="mc-team">'+avatar(f.home)+'<div><div class="mc-city">'+h.c+'</div><div class="mc-name">'+h.n+'</div></div></div>' +
    '<div class="odds"><span class="line">—</span></div><div class="odds"><span class="line">—</span></div><div class="odds"><span class="price">'+(f.hwML>0?'+':'')+f.hwML+'</span></div></div>' +
    '<div class="mc-footer"><span>'+f.time+'</span><span>Moneyline only from Owls</span></div></div>';
});
var slip = document.getElementById('slip');
var b = fights[0];
slip.innerHTML =
  '<div class="dkslip-leg"><div class="dkslip-leg-logo">'+ (typeof getPlayerPhotoImg==='function'?getPlayerPhotoImg(b.home,'mma',36,{borderRadius:'10px'}):'BM') +'</div><div><div class="pick">'+b.home+'</div><div class="mkt">Moneyline</div></div><div class="odds-s">-135</div></div>' +
  '<div class="dkslip-leg"><div class="dkslip-leg-logo"><span class="dkslip-ou dkslip-ou-o">O</span></div><div><div class="pick">Over 2.5</div><div class="mkt">Total</div></div><div class="odds-s">-110</div></div>' +
  '<div class="dkslip-leg"><div class="dkslip-leg-logo"><span class="dkslip-ou dkslip-ou-u">U</span></div><div><div class="pick">Under 2.5</div><div class="mkt">Total</div></div><div class="odds-s">-110</div></div>';
if (typeof hydratePlayerPhotos === 'function') hydratePlayerPhotos(document, 'mma');
</script>
</body>
</html>
