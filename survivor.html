<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Survivor Pool — Pocketbooks Sports</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--green:#00ff88;--red:#ff3d57;--cyan:#00c2ff;--gold:#f5c842;--card:#111;--bg:#0a0a0a}
body{font-family:-apple-system,'SF Pro Display',Arial,sans-serif;background:var(--bg);color:#fff;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hdr{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:0;z-index:20;background:rgba(10,10,10,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #1a1a1a}
.back{width:36px;height:36px;border-radius:10px;background:#111;border:1px solid #222;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.1rem}
.hdr h1{font-size:1.05rem;font-weight:900;letter-spacing:-0.3px}
.hdr-sub{font-size:0.68rem;color:#555;margin-top:2px}
.wrap{padding:16px}
.card{background:var(--card);border:1px solid #1c1c1c;border-radius:16px;padding:16px;margin-bottom:12px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:0.92rem;font-weight:900;cursor:pointer;font-family:inherit}
.btn-green{background:var(--green);color:#000}
.btn-cyan{background:transparent;color:var(--cyan);border:1px solid rgba(0,194,255,0.4)}
.btn-ghost{background:transparent;color:#888;border:1px solid #252525}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.sec-lbl{font-size:0.72rem;font-weight:800;color:#666;text-transform:uppercase;letter-spacing:0.6px;margin:4px 0 10px}
.pool-row{background:#111;border:1px solid #1c1c1c;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pool-row:active{border-color:#00ff88}
.pool-ico{width:40px;height:40px;border-radius:12px;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.pool-name{font-size:0.95rem;font-weight:800}
.pool-meta{font-size:0.68rem;color:#666;margin-top:3px}
.pill{display:inline-block;font-size:0.58rem;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;margin-left:6px}
.pill-alive{background:rgba(0,255,136,0.12);color:var(--green);border:1px solid rgba(0,255,136,0.3)}
.pill-elim{background:rgba(255,61,87,0.12);color:var(--red);border:1px solid rgba(255,61,87,0.3)}
.pill-host{background:rgba(245,200,66,0.12);color:var(--gold);border:1px solid rgba(245,200,66,0.3)}
.empty{text-align:center;padding:28px 12px;color:#555;font-size:0.82rem}
.err{color:var(--red);font-size:0.78rem;padding:10px 12px;background:rgba(255,61,87,0.08);border:1px solid rgba(255,61,87,0.2);border-radius:10px;margin-bottom:12px;display:none}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#141414;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:24px}
.modal-title{font-size:1.1rem;font-weight:900;margin-bottom:4px}
.modal-sub{font-size:0.78rem;color:#555;margin-bottom:16px}
.inp,select.inp{width:100%;padding:14px 16px;background:#1c1c1c;border:1.5px solid #252525;border-radius:12px;color:#fff;font-size:0.95rem;outline:none;margin-bottom:10px;font-family:inherit}
.inp:focus,select.inp:focus{border-color:var(--green)}
.join-code{font-size:1.6rem;font-weight:900;letter-spacing:4px;color:var(--green);text-align:center;padding:14px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.25);border-radius:12px;margin:10px 0}
.hidden{display:none}
.stat-row{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:12px;text-align:center}
.stat-n{font-size:1.15rem;font-weight:900;color:var(--green)}
.stat-l{font-size:0.62rem;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin-top:2px}
.player{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a}
.player:last-child{border-bottom:none}
.p-name{font-size:0.88rem;font-weight:700}
.p-alive{color:var(--green)}
.p-elim{color:#555}
select.inp option:disabled{color:#444}
.used-note{font-size:0.68rem;color:#555;margin:-4px 0 10px}
.code-chip{font-family:monospace;font-size:0.78rem;color:var(--cyan);background:rgba(0,194,255,0.08);border:1px solid rgba(0,194,255,0.25);padding:4px 8px;border-radius:8px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1c1c1c;border:1px solid #333;color:#fff;padding:12px 20px;border-radius:12px;font-size:0.85rem;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.mu-card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.mu-row{display:flex;align-items:stretch;gap:8px}
.mu-team{flex:1;background:#0c0c0c;border:1.5px solid #222;border-radius:12px;padding:14px 8px 12px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s,background .15s,box-shadow .15s;min-width:0}
.mu-team.sel{border-color:#00ff88;background:rgba(0,255,136,0.08);box-shadow:0 0 18px rgba(0,255,136,0.2)}
.mu-team.used{opacity:0.4;border-color:#333;cursor:not-allowed}
.mu-team.lost{cursor:not-allowed}
.mu-logo{width:52px;height:52px;object-fit:contain;margin:0 auto 8px;display:block}
.mu-name{font-size:0.78rem;font-weight:800;line-height:1.2}
.mu-rec{font-size:0.58rem;color:#666;margin-top:3px}
.mu-ml{font-size:0.8rem;font-weight:800;color:#ccc;margin-top:6px}
.mu-at{width:22px;display:flex;align-items:center;justify-content:center;font-size:0.62rem;color:#555;font-weight:900}
.mu-time{text-align:center;font-size:0.68rem;color:#666;margin-top:10px}
.used-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.62rem;font-weight:900;letter-spacing:0.5px;text-transform:uppercase;color:#bbb;background:rgba(10,10,10,0.55);border-radius:12px}
.lost-x{position:absolute;top:6px;right:8px;color:#ff3d57;font-size:1.15rem;font-weight:900;line-height:1}
.your-pick{display:flex;align-items:center;gap:10px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.35);border-radius:12px;padding:12px;margin-bottom:12px}
.your-pick img{width:36px;height:36px;object-fit:contain}
.your-pick-name{font-size:0.92rem;font-weight:800;color:var(--green)}
.your-pick-ok{margin-left:auto;color:var(--green);font-size:1.1rem;font-weight:900}
.confirm-wrap{margin-top:4px}
.offseason{text-align:center;padding:28px 16px;color:#888;font-size:0.84rem;line-height:1.55}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.week-arrow{width:36px;height:36px;border-radius:10px;background:#111;border:1px solid #222;color:#fff;font-size:1.15rem;font-weight:900;cursor:pointer;font-family:inherit}
.week-arrow:disabled{opacity:0.3;cursor:not-allowed}
.week-label{font-size:0.88rem;font-weight:900;letter-spacing:0.2px}
.pick-banner{background:#111;border:1px solid #222;border-radius:12px;padding:10px 12px;font-size:0.78rem;font-weight:700;margin-bottom:12px;text-align:center;line-height:1.45;color:#ccc}
.mu-card.locked .mu-team{cursor:default}
.mu-lock{position:absolute;top:8px;right:10px;font-size:0.8rem;opacity:0.45;z-index:2}
</style>
</head>
<body>

<div class="hdr">
  <a class="back" href="lobby.html" aria-label="Back to lobby">‹</a>
  <div>
    <h1>Survivor Pool</h1>
    <div class="hdr-sub" id="hdr-sub">Pick one NFL team each week. Lose and you’re out.</div>
  </div>
</div>

<div class="wrap">
  <div class="err" id="err"></div>

  <div id="view-home">
    <div class="row-btns">
      <button class="btn btn-green" onclick="openModal('modal-create')">Create Pool</button>
      <button class="btn btn-cyan" onclick="openModal('modal-join')">Join Pool</button>
    </div>
    <div class="sec-lbl">My Pools</div>
    <div id="my-pools"><div class="empty">Loading…</div></div>
  </div>

  <div id="view-detail" class="hidden">
    <button class="btn btn-ghost" style="margin-bottom:12px" onclick="showHome()">← All pools</button>
    <div class="card" id="detail-head"></div>
    <div class="stat-row" id="detail-stats"></div>

    <div class="card" id="pick-card">
      <div class="sec-lbl">Make Your Pick</div>
      <div id="pick-body"></div>
    </div>

    <div class="card">
      <div class="sec-lbl">Standings</div>
      <div id="standings-body"></div>
    </div>

    <div class="card">
      <div class="sec-lbl">This Week’s Picks</div>
      <div id="week-picks-body"></div>
    </div>

    <div id="host-actions" class="hidden">
      <button class="btn btn-cyan" id="grade-btn" onclick="gradeWeek()">Grade this week</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-create" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <div class="modal-title">Create Pool</div>
    <div class="modal-sub">Share the join code with your group. No entry fee.</div>
    <div id="create-form">
      <input class="inp" id="create-name" placeholder="Pool name" maxlength="60">
      <button class="btn btn-green" onclick="createPool()">Create</button>
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
    </div>
    <div id="create-done" class="hidden">
      <div class="modal-sub">Share this code:</div>
      <div class="join-code" id="created-code"></div>
      <button class="btn btn-green" onclick="copyCreatedCode()">Copy code</button>
      <button class="btn btn-ghost" onclick="closeModals()">Done</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-join" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <div class="modal-title">Join Pool</div>
    <div class="modal-sub">Enter the 6-character join code.</div>
    <input class="inp" id="join-code" placeholder="ABC123" maxlength="8" style="text-transform:uppercase;letter-spacing:2px">
    <button class="btn btn-green" onclick="joinPool()">Join</button>
    <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
  </div>
</div>

<script>
const API = 'https://pocketbooks-sports-backend-production.up.railway.app';
let TOKEN = localStorage.getItem('pb-sports-token') || '';
var NFL_TEAM_LOGOS = {
  'Arizona Cardinals': 'ari', 'Atlanta Falcons': 'atl', 'Baltimore Ravens': 'bal',
  'Buffalo Bills': 'buf', 'Carolina Panthers': 'car', 'Chicago Bears': 'chi',
  'Cincinnati Bengals': 'cin', 'Cleveland Browns': 'cle', 'Dallas Cowboys': 'dal',
  'Denver Broncos': 'den', 'Detroit Lions': 'det', 'Green Bay Packers': 'gb',
  'Houston Texans': 'hou', 'Indianapolis Colts': 'ind', 'Jacksonville Jaguars': 'jax',
  'Kansas City Chiefs': 'kc', 'Las Vegas Raiders': 'lv', 'Los Angeles Chargers': 'lac',
  'Los Angeles Rams': 'lar', 'Miami Dolphins': 'mia', 'Minnesota Vikings': 'min',
  'New England Patriots': 'ne', 'New Orleans Saints': 'no', 'New York Giants': 'nyg',
  'New York Jets': 'nyj', 'Philadelphia Eagles': 'phi', 'Pittsburgh Steelers': 'pit',
  'San Francisco 49ers': 'sf', 'Seattle Seahawks': 'sea', 'Tampa Bay Buccaneers': 'tb',
  'Tennessee Titans': 'ten', 'Washington Commanders': 'wsh'
};

let currentPoolId = null;
let currentDetail = null;
let createdJoinCode = '';
let nflGames = [];
let pendingPick = null;
let pickLoadId = 0;
let savedPickTeam = null;
let browseWeek = 1;
let picksOpen = false;
let scheduleLocked = true;
let oddsGames = [];
let espnCache = {};
let week1OpenLabel = '';

function showErr(msg){
  var el = document.getElementById('err');
  if (!msg) { el.style.display='none'; el.textContent=''; return; }
  el.textContent = msg; el.style.display='block';
}
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200);
}
function openModal(id){
  document.getElementById(id).classList.add('open');
  if (id==='modal-create'){
    document.getElementById('create-form').classList.remove('hidden');
    document.getElementById('create-done').classList.add('hidden');
    document.getElementById('create-name').value='';
  }
}
function closeModals(){
  document.querySelectorAll('.modal-bg').forEach(function(m){ m.classList.remove('open'); });
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

async function api(method, path, body){
  var r = await fetch(API+path, {
    method: method,
    headers: Object.assign(
      {'Content-Type':'application/json'},
      TOKEN ? {'Authorization':'Bearer '+TOKEN} : {}
    ),
    body: body ? JSON.stringify(body) : undefined
  });
  var data = {};
  try { data = await r.json(); } catch(_e){}
  if (!r.ok && !data.error) data.error = 'request_failed';
  data._status = r.status;
  return data;
}

function displayName(row){
  return row.playerUsername || row.player_username || row.playerId || row.player_id || 'Player';
}

function teamMatches(a, b){
  var na = String(a||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  var nb = String(b||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if (!na || !nb) return false;
  return na === nb || na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0;
}
function canonicalTeam(name){
  if (NFL_TEAM_LOGOS[name]) return name;
  var keys = Object.keys(NFL_TEAM_LOGOS);
  for (var i=0;i<keys.length;i++){ if (teamMatches(keys[i], name)) return keys[i]; }
  return name || '';
}
function teamLogoUrl(name){
  var key = canonicalTeam(name);
  var ab = NFL_TEAM_LOGOS[key];
  return ab ? 'https://a.espncdn.com/i/teamlogos/nfl/500/'+ab+'.png' : '';
}
function shortTeam(name){
  var n = canonicalTeam(name);
  var parts = String(n).split(' ');
  return parts[parts.length-1] || n;
}
function fmtOdds(n){
  if (n == null || n === '') return '';
  var x = Number(n);
  if (isNaN(x)) return '';
  return (x > 0 ? '+' : '') + x;
}
function fmtGameTime(iso){
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    }) + ' ET';
  } catch(_e){ return ''; }
}
function mlFor(game, team){
  var list = game && Array.isArray(game.moneyline) ? game.moneyline : [];
  var hit = list.find(function(m){ return teamMatches(m.team, team); });
  return hit ? hit.odds : null;
}
function recFor(game, side, team){
  var rec = (game && (game[side+'Record'] || game[side+'_record'] || game[side+'record'])) || '';
  if (!rec && game && game.records) rec = game.records[team] || game.records[side] || '';
  return rec || '';
}
function teamLost(game, team){
  if (!game) return false;
  var final = game.isFinal || game.status === 'final' || game.completed;
  var hs = game.homeScore != null ? game.homeScore : game.home_score;
  var as = game.awayScore != null ? game.awayScore : game.away_score;
  if (!final || hs == null || as == null) return false;
  var home = game.home || game.home_team;
  var away = game.away || game.away_team;
  if (teamMatches(team, home)) return Number(hs) < Number(as);
  if (teamMatches(team, away)) return Number(as) < Number(hs);
  return false;
}

function showHome(){
  currentPoolId = null;
  currentDetail = null;
  pendingPick = null;
  savedPickTeam = null;
  nflGames = [];
  browseWeek = 1;
  picksOpen = false;
  scheduleLocked = true;
  oddsGames = [];
  document.getElementById('view-detail').classList.add('hidden');
  document.getElementById('view-home').classList.remove('hidden');
  document.getElementById('hdr-sub').textContent = 'Pick one NFL team each week. Lose and you’re out.';
  loadMyPools();
}

async function loadMyPools(){
  var el = document.getElementById('my-pools');
  var data = await api('GET', '/api/survivor/my-pools');
  if (data.error) { el.innerHTML = '<div class="empty">Could not load pools.</div>'; showErr(data.error); return; }
  showErr('');
  var pools = data.pools || [];
  if (!pools.length){
    el.innerHTML = '<div class="empty">You’re not in any pools yet. Create one or join with a code.</div>';
    return;
  }
  el.innerHTML = pools.map(function(p){
    var st = p.myStatus === 'eliminated' ? '<span class="pill pill-elim">Eliminated W'+(p.eliminatedWeek||'')+'</span>' : '<span class="pill pill-alive">Alive</span>';
    var host = p.isHost ? '<span class="pill pill-host">Host</span>' : '';
    return '<div class="pool-row" onclick="openPool(\''+esc(p.poolId)+'\')">'
      + '<div class="pool-ico">🛡️</div>'
      + '<div><div class="pool-name">'+esc(p.name)+host+'</div>'
      + '<div class="pool-meta">Season '+esc(p.season)+' · Week '+esc(p.currentWeek)+' '+st+'</div></div></div>';
  }).join('');
}

async function createPool(){
  var name = (document.getElementById('create-name').value||'').trim();
  if (!name) { toast('Enter a pool name'); return; }
  var data = await api('POST', '/api/survivor/create', { name: name, season: 2026 });
  if (!data.ok) { toast(data.error || 'Create failed'); return; }
  createdJoinCode = data.joinCode || '';
  document.getElementById('created-code').textContent = createdJoinCode;
  document.getElementById('create-form').classList.add('hidden');
  document.getElementById('create-done').classList.remove('hidden');
  loadMyPools();
}

function copyCreatedCode(){
  if (!createdJoinCode) return;
  if (navigator.clipboard) navigator.clipboard.writeText(createdJoinCode).catch(function(){});
  toast('Copied '+createdJoinCode);
}

async function joinPool(){
  var code = (document.getElementById('join-code').value||'').trim().toUpperCase();
  if (!code) { toast('Enter a join code'); return; }
  var data = await api('POST', '/api/survivor/join', { joinCode: code });
  if (!data.ok && data.error !== 'already_joined') { toast(data.error || 'Join failed'); return; }
  closeModals();
  toast(data.poolName ? ('Joined '+data.poolName) : 'Joined pool');
  if (data.poolId) openPool(data.poolId);
  else loadMyPools();
}

async function openPool(poolId){
  currentPoolId = poolId;
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-detail').classList.remove('hidden');
  document.getElementById('detail-head').innerHTML = '<div class="empty">Loading…</div>';
  var detail = await api('GET', '/api/survivor/'+encodeURIComponent(poolId));
  if (!detail.ok) { showErr(detail.error||'Could not load pool'); showHome(); return; }
  currentDetail = detail;
  var standings = await api('GET', '/api/survivor/'+encodeURIComponent(poolId)+'/standings');
  renderDetail(detail, standings);
}

function renderDetail(detail, standings){
  var pool = detail.pool || {};
  document.getElementById('hdr-sub').textContent = (pool.name||'Pool')+' · Week '+(pool.currentWeek||1);
  var host = detail.isHost ? '<span class="pill pill-host">Host</span>' : '';
  document.getElementById('detail-head').innerHTML =
    '<div class="pool-name">'+esc(pool.name)+host+'</div>'
    + '<div class="pool-meta" style="margin-top:6px">Season '+esc(pool.season)
    + ' · Week '+esc(pool.currentWeek)
    + ' · Status '+esc(pool.status)
    + '</div>'
    + '<div style="margin-top:10px">Join code <span class="code-chip" onclick="copyCode(\''+esc(pool.joinCode)+'\')">'+esc(pool.joinCode)+'</span></div>';

  var alive = (standings.alive||[]).length;
  var elim = (standings.eliminated||[]).length;
  document.getElementById('detail-stats').innerHTML =
    '<div class="stat"><div class="stat-n">'+alive+'</div><div class="stat-l">Alive</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:#888">'+elim+'</div><div class="stat-l">Eliminated</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--cyan)">W'+esc(pool.currentWeek)+'</div><div class="stat-l">Current week</div></div>';

  renderPick(detail);
  renderStandings(standings);
  renderWeekPicks(standings, detail);
  document.getElementById('host-actions').classList.toggle('hidden', !detail.isHost || pool.status!=='active');
}

function copyCode(code){
  if (navigator.clipboard) navigator.clipboard.writeText(code).catch(function(){});
  toast('Copied '+code);
}

function parseEspnDate(s){
  if (!s) return '';
  if (/T\d{2}:\d{2}Z$/.test(s)) return s.replace(/Z$/, ':00Z');
  return s;
}
function parseEspnScoreboard(data){
  var events = (data && data.events) || [];
  return events.map(function(e){
    var c = (e.competitions || [])[0] || {};
    var home='', away='', homeRec='', awayRec='';
    var homeScore=null, awayScore=null;
    var st = (c.status && c.status.type) || {};
    var completed = !!(st.completed || st.name === 'STATUS_FINAL');
    (c.competitors || []).forEach(function(x){
      var t = (x.team && (x.team.displayName || x.team.name)) || '';
      var rec = ((x.records || [])[0] || {}).summary || '';
      var score = (x.score !== '' && x.score != null) ? parseInt(x.score, 10) : null;
      if (x.homeAway === 'home'){ home=t; homeRec=rec; homeScore=score; }
      else { away=t; awayRec=rec; awayScore=score; }
    });
    return {
      id: e.id, home: home, away: away,
      time: parseEspnDate(c.date || e.date),
      homeRecord: homeRec, awayRecord: awayRec,
      homeScore: homeScore, awayScore: awayScore,
      isFinal: completed, moneyline: []
    };
  }).sort(function(a,b){ return new Date(a.time) - new Date(b.time); });
}
async function fetchEspnWeek(week){
  var w = Math.max(1, Math.min(18, parseInt(week,10)||1));
  if (espnCache[w] && espnCache[w].games) return espnCache[w];
  var url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week='+w;
  var r = await fetch(url);
  if (!r.ok) throw new Error('espn_'+r.status);
  var data = await r.json();
  var parsed = { week: (data.week && data.week.number) || w, games: parseEspnScoreboard(data) };
  espnCache[w] = parsed;
  return parsed;
}
async function ensureWeek1OpenLabel(){
  if (week1OpenLabel) return week1OpenLabel;
  try {
    var w1 = await fetchEspnWeek(1);
    var first = (w1.games || [])[0];
    if (first && first.time){
      week1OpenLabel = new Date(first.time).toLocaleString('en-US', {
        timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric'
      });
    }
  } catch(_e){}
  if (!week1OpenLabel) week1OpenLabel = 'Sep 10';
  return week1OpenLabel;
}
function mergeEspnRecords(oddsList, espnList){
  return (oddsList || []).map(function(g){
    var e = (espnList || []).find(function(x){
      return teamMatches(x.home, g.home || g.home_team) && teamMatches(x.away, g.away || g.away_team);
    });
    if (!e) return g;
    return Object.assign({}, g, {
      homeRecord: g.homeRecord || e.homeRecord,
      awayRecord: g.awayRecord || e.awayRecord,
      time: g.time || g.scheduledStart || e.time
    });
  });
}
async function loadBrowseWeekGames(){
  var poolWeek = currentDetail && currentDetail.pool && currentDetail.pool.currentWeek;
  var espn = { games: [] };
  try { espn = await fetchEspnWeek(browseWeek); } catch(_e){ espn = { games: [] }; }
  if (picksOpen && browseWeek === poolWeek && oddsGames.length){
    nflGames = mergeEspnRecords(oddsGames, espn.games);
    scheduleLocked = false;
  } else {
    nflGames = espn.games || [];
    scheduleLocked = true;
  }
}
async function shiftBrowseWeek(delta){
  var next = Math.max(1, Math.min(18, browseWeek + delta));
  if (next === browseWeek || !currentDetail) return;
  browseWeek = next;
  var body = document.getElementById('pick-body');
  if (body) body.innerHTML = weekNavHtml() + '<div class="empty">Loading week '+browseWeek+'…</div>';
  await loadBrowseWeekGames();
  paintMatchups(currentDetail);
}
function weekNavHtml(){
  return '<div class="week-nav">'
    + '<button class="week-arrow" onclick="shiftBrowseWeek(-1)" '+(browseWeek<=1?'disabled':'')+'>‹</button>'
    + '<div class="week-label">Week '+browseWeek+'</div>'
    + '<button class="week-arrow" onclick="shiftBrowseWeek(1)" '+(browseWeek>=18?'disabled':'')+'>›</button>'
    + '</div>';
}
function pickBannerHtml(){
  if (!scheduleLocked && picksOpen){
    return '<div class="pick-banner">Week '+browseWeek+' — Pick deadline: Sunday 1:00 PM ET</div>';
  }
  var when = week1OpenLabel || 'Sep 10';
  return '<div class="pick-banner">🏈 Week '+browseWeek+' Preview — Picks open '+esc(when)+'</div>';
}

async function renderPick(detail){
  var body = document.getElementById('pick-body');
  var entry = detail.myEntry;
  var pool = detail.pool || {};
  if (!entry){
    body.innerHTML = '<div class="empty">You’re not in this pool.</div>';
    return;
  }
  if (entry.status !== 'alive'){
    body.innerHTML = '<div class="empty">Eliminated in week '+(entry.eliminated_week||entry.eliminatedWeek||'?')+'.</div>';
    return;
  }
  if (pool.status !== 'active'){
    body.innerHTML = '<div class="empty">This pool is '+esc(pool.status)+'.</div>';
    return;
  }
  var myWeek = (detail.myPicks||[]).find(function(p){ return p.week === pool.currentWeek; });
  savedPickTeam = myWeek ? canonicalTeam(myWeek.team) : null;
  pendingPick = savedPickTeam ? { team: savedPickTeam, gameId: myWeek && myWeek.game_id, saved: true } : null;
  body.innerHTML = '<div class="empty">Loading matchups…</div>';
  var reqId = ++pickLoadId;
  var oddsP = api('GET', '/api/odds/nfl');
  var scoresP = api('GET', '/api/scores/nfl');
  var odds = await oddsP;
  var scores = await scoresP;
  if (reqId !== pickLoadId) return;
  var games = Array.isArray(odds) ? odds : (odds && Array.isArray(odds.games) ? odds.games : []);
  var scoreList = Array.isArray(scores) ? scores : [];
  oddsGames = games.map(function(g){
    var s = scoreList.find(function(x){
      return (g.id && x.id === g.id)
        || (teamMatches(x.home, g.home || g.home_team) && teamMatches(x.away, g.away || g.away_team));
    });
    if (!s) return g;
    return Object.assign({}, g, {
      completed: s.completed,
      isFinal: !!(s.completed || g.isFinal),
      home_score: s.home_score, away_score: s.away_score,
      homeScore: s.home_score, awayScore: s.away_score
    });
  });
  picksOpen = oddsGames.length > 0;
  browseWeek = picksOpen ? (pool.currentWeek || 1) : 1;
  await ensureWeek1OpenLabel();
  if (reqId !== pickLoadId) return;
  await loadBrowseWeekGames();
  if (reqId !== pickLoadId) return;
  paintMatchups(detail);
}

function paintMatchups(detail){
  var body = document.getElementById('pick-body');
  if (!body || !detail) return;
  var used = {};
  (detail.usedTeams||[]).forEach(function(t){ used[canonicalTeam(t)] = true; });
  if (savedPickTeam) used[savedPickTeam] = false;
  var locked = scheduleLocked;

  var html = weekNavHtml() + pickBannerHtml();
  if (savedPickTeam && pendingPick && pendingPick.saved && !locked){
    var logo = teamLogoUrl(savedPickTeam);
    html += '<div class="your-pick">'
      + (logo ? '<img src="'+esc(logo)+'" alt="">' : '')
      + '<div>Your pick: <span class="your-pick-name">'+esc(savedPickTeam)+'</span></div>'
      + '<div class="your-pick-ok">✓</div></div>';
  }
  if (!locked){
    html += '<div class="used-note">Tap a team, then confirm. Used teams cannot be picked again.</div>';
  }

  if (!nflGames.length){
    html += '<div class="offseason">Schedule unavailable for this week. Try another week.</div>';
    body.innerHTML = html;
    return;
  }

  nflGames.forEach(function(g, gi){
    var away = canonicalTeam(g.away || g.away_team);
    var home = canonicalTeam(g.home || g.home_team);
    var gameId = g.id || g.providerGameId || '';
    html += '<div class="mu-card'+(locked?' locked':'')+'">'
      + (locked ? '<div class="mu-lock">🔒</div>' : '')
      + '<div class="mu-row">'
      + teamCellHtml(g, away, 'away', used, gameId, gi, locked)
      + '<div class="mu-at">@</div>'
      + teamCellHtml(g, home, 'home', used, gameId, gi, locked)
      + '</div>'
      + '<div class="mu-time">'+esc(fmtGameTime(g.time || g.scheduledStart || g.commence_time))+'</div>'
      + '</div>';
  });

  var showConfirm = !locked && pendingPick && pendingPick.team && !pendingPick.saved;
  if (showConfirm){
    html += '<div class="confirm-wrap"><button class="btn btn-green" id="submit-pick" onclick="submitPick()">Confirm '+esc(shortTeam(pendingPick.team))+'</button></div>';
  }
  body.innerHTML = html;
}

function teamCellHtml(game, team, side, used, gameId, gi, locked){
  var isUsed = !locked && !!used[team];
  var lost = !locked && teamLost(game, team);
  var selected = !locked && pendingPick && teamMatches(pendingPick.team, team);
  var cls = 'mu-team' + (selected?' sel':'') + (isUsed?' used':'') + (lost?' lost':'');
  var rec = recFor(game, side, team);
  var ml = locked ? '' : fmtOdds(mlFor(game, team));
  var logo = teamLogoUrl(team);
  var overlay = isUsed ? '<div class="used-badge">Already Used</div>' : '';
  var x = lost && !isUsed ? '<div class="lost-x">✕</div>' : '';
  var click = (locked || isUsed || lost) ? '' : 'onclick="selectMatchupTeam('+gi+',\''+side+'\')"';
  return '<div class="'+cls+'" '+click+'>'
    + x + overlay
    + (logo ? '<img class="mu-logo" src="'+esc(logo)+'" alt="'+esc(team)+'">' : '')
    + '<div class="mu-name">'+esc(shortTeam(team))+'</div>'
    + (rec ? '<div class="mu-rec">'+esc(rec)+'</div>' : '')
    + (ml ? '<div class="mu-ml">'+esc(ml)+'</div>' : '')
    + '</div>';
}

function selectMatchupTeam(gi, side){
  if (scheduleLocked) return;
  var g = nflGames[gi];
  if (!g) return;
  var team = canonicalTeam(side === 'home' ? (g.home || g.home_team) : (g.away || g.away_team));
  if (!team || !currentDetail) return;
  var used = {};
  (currentDetail.usedTeams||[]).forEach(function(t){ used[canonicalTeam(t)] = true; });
  if (savedPickTeam) used[savedPickTeam] = false;
  if (used[team] || teamLost(g, team)) return;
  pendingPick = {
    team: team,
    gameId: g.id || g.providerGameId || null,
    saved: !!(savedPickTeam && teamMatches(savedPickTeam, team))
  };
  paintMatchups(currentDetail);
}

function renderStandings(standings){
  var alive = standings.alive || [];
  var elim = standings.eliminated || [];
  var html = '';
  if (!alive.length && !elim.length) html = '<div class="empty">No players yet.</div>';
  else {
    html += alive.map(function(p){
      return '<div class="player"><span class="p-name p-alive">'+esc(displayName(p))+'</span><span class="pill pill-alive">Alive</span></div>';
    }).join('');
    html += elim.map(function(p){
      return '<div class="player"><span class="p-name p-elim">'+esc(displayName(p))+'</span><span class="pill pill-elim">Out W'+esc(p.eliminatedWeek)+'</span></div>';
    }).join('');
  }
  document.getElementById('standings-body').innerHTML = html;
}

function renderWeekPicks(standings, detail){
  var el = document.getElementById('week-picks-body');
  var revealed = !!(standings && standings.picksRevealed);
  if (!revealed){
    var count = (standings.thisWeekPicks||[]).length;
    el.innerHTML = '<div class="empty">Picks stay hidden until the Sunday 1:00 PM ET deadline (or after grading). '
      + count + ' pick'+(count===1?'':'s')+' in so far.</div>';
    return;
  }
  var rows = standings.thisWeekPicks || [];
  if (!rows.length){
    el.innerHTML = '<div class="empty">No picks this week.</div>';
    return;
  }
  el.innerHTML = rows.map(function(p){
    var res = p.result === 'won' ? '<span class="pill pill-alive">Won</span>'
            : p.result === 'lost' ? '<span class="pill pill-elim">Lost</span>'
            : '<span class="pill" style="color:#888;border:1px solid #333">Pending</span>';
    return '<div class="player"><span class="p-name">'+esc(displayName(p))+'</span>'
      + '<span>'+esc(p.team||'—')+' '+res+'</span></div>';
  }).join('');
}

async function submitPick(){
  if (scheduleLocked) return;
  if (!currentPoolId || !currentDetail) return;
  var team = pendingPick && pendingPick.team;
  if (!team) { toast('Select a team'); return; }
  var week = currentDetail.pool.currentWeek;
  var btn = document.getElementById('submit-pick');
  if (btn) btn.disabled = true;
  var data = await api('POST', '/api/survivor/'+encodeURIComponent(currentPoolId)+'/pick', {
    week: week, team: team, gameId: pendingPick.gameId || undefined
  });
  if (btn) btn.disabled = false;
  if (!data.ok) { toast(data.error || 'Pick failed'); return; }
  toast('Pick saved: '+team);
  openPool(currentPoolId);
}

async function gradeWeek(){
  if (!currentPoolId || !currentDetail) return;
  var btn = document.getElementById('grade-btn');
  btn.disabled = true;
  var data = await api('POST', '/api/survivor/'+encodeURIComponent(currentPoolId)+'/grade', { week: currentDetail.pool.currentWeek });
  btn.disabled = false;
  if (!data.ok) { toast(data.error || 'Grade failed'); return; }
  var msg = (data.eliminated||[]).length + ' eliminated, ' + (data.survivors||[]).length + ' still alive';
  if (data.scoresError) msg += ' (scores: '+data.scoresError+')';
  toast(msg);
  openPool(currentPoolId);
}

(function init(){
  if (!TOKEN) { window.location.href = 'lobby.html'; return; }
  try { JSON.parse(localStorage.getItem('pb-club') || 'null'); } catch(_e){}
  var q = new URLSearchParams(window.location.search).get('pool');
  loadMyPools().then(function(){
    if (q) openPool(q);
  });
})();
</script>
